<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Central</title>
  <link rel="shortcut icon" href="img/favicop.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="encabezado">
      <img src="img/logo.png" alt="inicio">
      <nav class="menu">
        <a href="#">Inicio</a>
        <a href="#">Contacto</a>
        <a href="#">Nosotros</a>
      </nav>
    </div>
 </header>

<section class="seccion-portada">

    <div class="portada">
        <img src="img/CAFE_PORTADA.png" alt="portada">

        <button>Hacer pedido!</button>
    </div>

</section>

    <section class="seccion-procutos">

      <h2>NUESTROS PRODUCTOS!</h2> 
      <div class="PRODUCTOS">
      <ul>
        <li class="capuccino">
          <img src="img/cappuciono.webp" alt="cappuciono">
          <h2> cappucino</h2>
          <p>Café suave con espuma<br> de leche.</p>
           <button>
            <i class="fi fi-rr-shopping-cart"></i>
            Comprar!
          </button>
        </li>

        <li class="ice_latte">
          <img src="img/ice_latte.webp" alt="ice_latte">
          <h2> Iced Latte</h2>
          <p>Café frio con leche.</p>
          <button>
            <i class="fi fi-rr-shopping-cart"></i>
            Comprar!
          </button>
        </li>

      <li class="Croissant">
          <img src="img/Croissant.webp" alt="croissant">
          <h2> Croissant </h2>
          <p>Hojaldre artesanal.</p>
          <button>
            <i class="fi fi-rr-shopping-cart"></i>
            Comprar!
          </button>
      </li>
      
      <li class="Brownie">
          <img src="img/Brownie.webp" alt="Brownie">
          <h2>Brownie</h2>
          <p>Chocolate en su punto justo.</p>
          <button>
            <i class="fi fi-rr-shopping-cart"></i>
            Comprar!
          </button>
        </li>
      </ul>

    </section>

  </main>

  <footer>

  </footer>

  
</body>
</html>
